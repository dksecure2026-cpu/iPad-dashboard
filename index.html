    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDateDisplay(dStr) {
      if (!dStr) return '';
      try {
        var d = new Date(dStr);
        if (isNaN(d.getTime())) return dStr;
        return d.toLocaleDateString(undefined, {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch(e) {
        return dStr;
      }
    }

    // ==========================================
    // HIGH PERFORMANCE IMAGE COMPRESSION
    // Reduces iPad 8MB photo to ~200-300KB
    // ==========================================
    function toBase64(file, maxDim, quality) {
      maxDim = maxDim || 1280;
      quality = quality || 0.65;
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
          var img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            var width = img.width;
            var height = img.height;

            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            var result = canvas.toDataURL('image/jpeg', quality);
            canvas.width = 0;
            canvas.height = 0;
            resolve(result);
          };
          img.onerror = function(err) { reject(err); };
        };
        reader.onerror = function(err) { reject(err); };
      });
    }

    function loadRecceReports(forceReload) {
      var statusDiv = document.getElementById('recce-folder-status');
      var grid = document.getElementById('recce-folder-grid');

      if (!forceReload && recceReportsCache && recceReportsCache.length > 0) {
        statusDiv.innerText = "Showing " + recceReportsCache.length + " report(s):";
        renderRecceButtons(recceReportsCache);
        return;
      }

      statusDiv.innerText = "Syncing PDF reports from Google Drive...";
      grid.innerHTML = "";

      var scriptId = 'jsonp-recce-reports';
      var oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleRecceReportsCallback = function(response) {
        if (!response || !response.reports || response.reports.length === 0) {
          statusDiv.innerText = "No Recce PDF reports found in Google Drive folder.";
          grid.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; grid-column: 1 / -1;">No reports found.</div>';
          recceReportsCache = [];
          return;
        }

        recceReportsCache = response.reports;
        statusDiv.innerText = "Showing " + recceReportsCache.length + " report(s):";
        renderRecceButtons(recceReportsCache);
      };

      var script = document.createElement('script');
      script.id = scriptId;
      script.src = webAppUrl + '?action=getRecceReports&callback=handleRecceReportsCallback&t=' + Date.now();
      document.body.appendChild(script);
    }

    function renderRecceButtons(reports) {
      var grid = document.getElementById('recce-folder-grid');

      reports.forEach(function(report) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'recce-folder-card';
        
        var cleanLabel = report.label || report.name || "Site Report";
        cleanLabel = cleanLabel.replace(/\.pdf$/i, '').trim();

        btn.onclick = function() {
          var previewUrl = report.previewUrl || ("https://drive.google.com/file/d/" + report.id + "/preview");
          openRecceViewer(cleanLabel, previewUrl, report.url);
        };

        btn.innerHTML = '<span class="recce-folder-icon">📍</span>' +
                        '<span class="recce-folder-label">' + escapeHtml(cleanLabel) + '</span>';

        grid.appendChild(btn);
      });
    }

    function processSelectedLogFile(file) {
      if (!file) return;

      fileName = file.name;
      mimeType = file.type || "application/octet-stream";

      var statusBox = document.getElementById('log-file-status');
      var nameSpan = document.getElementById('log-file-name');

      if (file.type && file.type.startsWith('image/')) {
        if (nameSpan) nameSpan.innerText = "⏳ Compressing: " + fileName;
        if (statusBox) statusBox.style.display = "flex";

        toBase64(file, 1280, 0.65).then(function(b64WithHeader) {
          base64Image = b64WithHeader.split(',')[1];
          mimeType = 'image/jpeg';
          if (nameSpan) nameSpan.innerText = "📷 " + fileName + " (Optimized)";
        }).catch(function(err) {
          alert("Error processing photo: " + err);
        });
      } else {
        var reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result.split(',')[1];
          if (nameSpan) nameSpan.innerText = "📄 " + fileName;
          if (statusBox) statusBox.style.display = "flex";
        };
        reader.onerror = function() {
          alert("Failed to read selected file.");
        };
        reader.readAsDataURL(file);
      }
    }

    function loadStaffRoster() {
      var statusDiv = document.getElementById('staff-status');
      var tbody = document.getElementById('staff-roster-body');
      statusDiv.innerText = "Syncing staff roster from Google Sheet...";

      var scriptId = 'jsonp-staff-roster';
      var oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleStaffRosterCallback = function(response) {
        if (!response || !response.roster || response.roster.length === 0) {
          statusDiv.innerText = "No staff records found.";
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">No personnel records found.</td></tr>';
          return;
        }

        staffRosterCache = response.roster.filter(function(r) { return !r.isEmpty; });
        statusDiv.innerText = "Active Team Members (" + staffRosterCache.length + "):";
        tbody.innerHTML = "";

        staffRosterCache.forEach(function(member) {
          var tr = document.createElement('tr');
          tr.className = 'staff-row-clickable';
          
          tr.addEventListener('click', function(e) {
            if (e.target.closest('a')) return;
            openEditStaffModal(member.rowIndex);
          });

          var initials = (member.name || "?").substring(0, 2).toUpperCase();
          var hasPhoto = Boolean(member.photoUrl && member.photoUrl.trim() !== "");

          var tdAvatar = document.createElement('td');
          var avatarWrapper = document.createElement('div');
          avatarWrapper.className = 'staff-avatar-wrapper';
          avatarWrapper.title = hasPhoto ? "Tap to view Callsign" : "Tap to Edit";

          if (hasPhoto) {
            var img = document.createElement('img');
            img.src = member.photoUrl;
            img.className = 'staff-avatar-img';
            img.alt = member.name || '';
            img.onerror = function() {
              this.parentElement.innerHTML = '<div class="staff-avatar-placeholder">' + initials + '</div>';
            };
            avatarWrapper.appendChild(img);
          } else {
            var placeholder = document.createElement('div');
            placeholder.className = 'staff-avatar-placeholder';
            placeholder.innerText = initials;
            avatarWrapper.appendChild(placeholder);
          }

          avatarWrapper.addEventListener('click', function(e) {
            e.stopPropagation();

            if (!hasPhoto) {
              openEditStaffModal(member.rowIndex);
              return;
            }

            var existing = avatarWrapper.querySelector('.nickname-speech-bubble');
            if (existing) {
              existing.remove();
              return;
            }

            document.querySelectorAll('.nickname-speech-bubble').forEach(function(b) { b.remove(); });

            var displayText = member.nickname ? ("🏷️ " + member.nickname) : ("👤 " + (member.name || 'Staff'));
            var bubble = document.createElement('div');
            bubble.className = 'nickname-speech-bubble';
            bubble.innerText = displayText;
            avatarWrapper.appendChild(bubble);

            setTimeout(function() {
              if (bubble && bubble.parentNode) bubble.remove();
            }, 2500);
          });

          tdAvatar.appendChild(avatarWrapper);
        tr.appendChild(tdAvatar);

          var tdName = document.createElement('td');
          tdName.innerHTML = '<div style="font-weight: 600; color: #fff;">' + escapeHtml(member.name || 'Unknown') + '</div>';
          tr.appendChild(tdName);

          var tdRole = document.createElement('td');
          tdRole.innerText = member.position || 'Staff';
          tr.appendChild(tdRole);

          var tdContact = document.createElement('td');
          if (member.phone) {
            var aPhone = document.createElement('a');
            aPhone.href = 'tel:' + member.phone;
            aPhone.className = 'staff-phone-link';
            aPhone.innerText = '📞 ' + member.phone;
            aPhone.addEventListener('click', function(e) { e.stopPropagation(); });
            tdContact.appendChild(aPhone);
          } else {
            tdContact.innerText = '—';
          }
          tr.appendChild(tdContact);

          var tdEmerg = document.createElement('td');
          tdEmerg.style.fontSize = '12px';
          tdEmerg.style.color = '#cbd5e1';
          tdEmerg.innerText = member.emergency || '—';
          tr.appendChild(tdEmerg);

          tbody.appendChild(tr);
        });
      };

      var script = document.createElement('script');
      script.id = scriptId;
      script.src = webAppUrl + '?action=getStaffRoster&callback=handleStaffRosterCallback&t=' + Date.now();
      document.body.appendChild(script);
    }

    window.handleActionFiles = function(rowIndex, fileList) {
      if (!fileList || fileList.length === 0) return;
      if (!itemAttachmentsMap[rowIndex]) itemAttachmentsMap[rowIndex] = [];

      var current = itemAttachmentsMap[rowIndex];
      var remaining = 3 - current.length;

      if (remaining <= 0) {
        alert("Maximum of 3 attachments reached for this update.");
        return;
      }

      var incoming = Array.from(fileList).slice(0, remaining);
      var counter = document.getElementById('action-file-count-' + rowIndex);
      if (counter) counter.innerText = "Optimizing attachments...";

      var processQueue = incoming.map(function(file) {
        if (file.type && file.type.startsWith('image/')) {
          return toBase64(file, 1280, 0.65).then(function(b64WithHeader) {
            return {
              name: file.name || ('photo_' + Date.now() + '.jpg'),
              mimeType: 'image/jpeg',
              base64: b64WithHeader.split(',')[1]
            };
          });
        } else {
          return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(e) {
              resolve({
                name: file.name,
                mimeType: file.type || 'application/octet-stream',
                base64: e.target.result.split(',')[1]
              });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
      });

      Promise.all(processQueue).then(function(results) {
        results.forEach(function(r) { current.push(r); });
        renderActionAttachments(rowIndex);
      }).catch(function(err) {
        alert("Error processing attachments: " + err.message);
        renderActionAttachments(rowIndex);
      });
    };

    window.removeActionAttachment = function(rowIndex, index) {
      if (!itemAttachmentsMap[rowIndex]) return;
      itemAttachmentsMap[rowIndex].splice(index, 1);
      renderActionAttachments(rowIndex);
    };

    function renderActionAttachments(rowIndex) {
      var container = document.getElementById('action-attachments-' + rowIndex);
      var counter = document.getElementById('action-file-count-' + rowIndex);
      var btnCam = document.getElementById('btn-action-cam-' + rowIndex);
      var btnFile = document.getElementById('btn-action-file-' + rowIndex);

      var files = itemAttachmentsMap[rowIndex] || [];
      if (counter) counter.innerText = files.length + " / 3 attached";

      var isFull = files.length >= 3;
      if (btnCam) btnCam.disabled = isFull;
      if (btnFile) btnFile.disabled = isFull;

      if (!container) return;
      container.innerHTML = "";

      files.forEach(function(item, idx) {
        var pill = document.createElement('div');
        pill.className = 'item-attachment-pill';

        var icon = item.mimeType.startsWith('image/') ? '🖼️' : '📄';
        var nameSpan = document.createElement('span');
        nameSpan.innerText = icon + ' ' + (item.name.length > 20 ? (item.name.substring(0, 18) + '...') : item.name);
        nameSpan.title = item.name;

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'item-pill-remove';
        removeBtn.innerText = '✕';
        removeBtn.onclick = function() { window.removeActionAttachment(rowIndex, idx); };

        pill.appendChild(nameSpan);
        pill.appendChild(removeBtn);
        container.appendChild(pill);
      });
    }

    function loadOpenItems() {
      var statusDiv = document.getElementById('open-items-status');
      var listDiv = document.getElementById('open-items-list');
      statusDiv.innerText = "Checking active items...";
      listDiv.innerHTML = "";
      itemAttachmentsMap = {};

      var scriptId = 'jsonp-open-items';
      var oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleOpenItemsCallback = function(response) {
        if (!response || !response.items || response.items.length === 0) {
          statusDiv.innerText = "✓ All action items are resolved. No open items.";
          return;
        }

        statusDiv.innerText = "Active Action Items (" + response.items.length + "):";
        listDiv.innerHTML = "";

        response.items.forEach(function(item) {
          var card = document.createElement('div');
          card.className = 'task-card';

          var isPending = item.status.toLowerCase() === 'pending';
          var badgeColor = isPending ? '#fb923c' : '#f87171';
          var badgeBg = isPending ? 'rgba(251, 146, 60, 0.15)' : 'rgba(248, 113, 113, 0.15)';

          var evidenceHtml = item.evidence 
            ? '<div style="margin-top: 8px;"><a href="' + item.evidence + '" target="_blank" style="color: #60a5fa; font-weight: 600; font-size: 13px; text-decoration: none;">🔗 View Uploaded Evidence</a></div>'
            : '';

          var updates = [];
          if (Array.isArray(item.updates)) {
            updates = item.updates;
          } else if (typeof item.updates === 'string' && item.updates.trim()) {
            try { updates = JSON.parse(item.updates); } catch(e) {}
          }

          var updatesListHtml = updates.map(function(u) {
            var updateAttHtml = '';
            if (u.attachments && Array.isArray(u.attachments) && u.attachments.length > 0) {
              updateAttHtml = '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">' +
                u.attachments.map(function(att) {
                  return '<a href="' + (att.url || '#') + '" target="_blank" style="font-size:11px; color:#60a5fa; text-decoration:none; background:rgba(96,165,250,0.1); padding:2px 6px; border-radius:4px; border:1px solid #3b82f6;">📎 ' + escapeHtml(att.name || 'Attachment') + '</a>';
                }).join('') +
              '</div>';
          }

            return '<div class="update-bubble">' +
                     '<div class="update-meta">' +
                       '<span>' + escapeHtml(u.author || 'Operator') + '</span>' +
                       '<span>' + formatDateDisplay(u.date) + '</span>' +
                     '</div>' +
                     '<div class="update-content">' + escapeHtml(u.text) + '</div>' +
                     updateAttHtml +
                   '</div>';
          }).join('');

          card.innerHTML = 
            '<div style="display: flex; justify-content: space-between; align-items: center;">' +
              '<span class="task-badge" style="background: ' + badgeBg + '; color: ' + badgeColor + '; border: 1px solid ' + badgeColor + ';">' + item.status + '</span>' +
              '<span style="font-size: 12px; color: var(--text-secondary);">' + (item.date || '') + ' | ' + (item.name || 'Officer') + '</span>' +
            '</div>' +
            '<div style="font-size: 15px; font-weight: 600; margin: 10px 0 6px 0; color: #fff;">' + (item.type || 'Log Entry') + '</div>' +
            '<div style="font-size: 14px; line-height: 1.5; color: #cbd5e1; white-space: pre-wrap; background: var(--card-bg); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color);">' + (item.remarks || 'No remarks provided.') + '</div>' +
            evidenceHtml +
            '<div class="updates-section">' +
              '<div class="updates-header">Activity & Follow-ups</div>' +
              '<div class="updates-list" id="updates-list-' + item.rowIndex + '">' +
                updatesListHtml +
              '</div>' +
              '<div class="add-update-container">' +
                '<textarea class="update-input-field" id="update-input-' + item.rowIndex + '" placeholder="Type update note or resolution progress..." rows="2" style="min-height: 60px;"></textarea>' +
                
                '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">' +
                  '<div style="display: flex; gap: 6px; flex: 1;">' +
                    '<button type="button" class="item-file-btn" id="btn-action-cam-' + item.rowIndex + '" style="background-color: #16a34a;" onclick="triggerActionCamera(' + item.rowIndex + ')">📷 Take Photo</button>' +
                    '<button type="button" class="item-file-btn" id="btn-action-file-' + item.rowIndex + '" style="background-color: #2563eb;" onclick="triggerActionFilePicker(' + item.rowIndex + ')">📁 Upload Doc</button>' +
                  '</div>' +
                  '<span id="action-file-count-' + item.rowIndex + '" style="font-size: 11px; color: var(--text-secondary); margin-left: 8px;">0 / 3 attached</span>' +
                '</div>' +

                '<input type="file" id="action-camera-input-' + item.rowIndex + '" accept="image/*" capture="environment" style="display:none;" onchange="handleActionFiles(' + item.rowIndex + ', this.files)">' +
                '<input type="file" id="action-file-input-' + item.rowIndex + '" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" multiple style="display:none;" onchange="handleActionFiles(' + item.rowIndex + ', this.files)">' +

                '<div id="action-attachments-' + item.rowIndex + '" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;"></div>' +

                '<button type="button" class="btn-add-update" id="btn-update-' + item.rowIndex + '" style="margin-top: 4px;" onclick="addLogUpdate(' + item.rowIndex + ')">Post Note Update</button>' +
              '</div>' +
            '</div>' +
            '<button type="button" class="close-item-btn" id="btn-close-' + item.rowIndex + '" onclick="closeLogItem(' + item.rowIndex + ')">✓ Mark as Closed</button>';

          listDiv.appendChild(card);
        });
      };

      var script = document.createElement('script');
      script.id = scriptId;
      script.src = webAppUrl + '?action=getOpenLogs&callback=handleOpenItemsCallback&t=' + Date.now();
      document.body.appendChild(script);

    window.addLogUpdate = function(rowIndex) {
      var input = document.getElementById('update-input-' + rowIndex);
      var updateText = input ? input.value.trim() : '';
      var attachments = itemAttachmentsMap[rowIndex] || [];

      if (!updateText && attachments.length === 0) {
        alert("Please enter a note or attach files before posting.");
        return;
      }

      var opNameInput = document.getElementById('active-operator-name');
      var operatorName = (opNameInput && opNameInput.value.trim()) ? opNameInput.value.trim() : 'Operator';
      var currentDateIso = new Date().toISOString();

      var btn = document.getElementById('btn-update-' + rowIndex);
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Posting & Uploading (" + attachments.length + " files)...";
      }

      var payload = {
        action: "appendLogUpdate",
        rowIndex: rowIndex,
        author: operatorName,
        date: currentDateIso,
        text: updateText,
        attachments: attachments
      };

      fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).then(function() {
        var list = document.getElementById('updates-list-' + rowIndex);
        if (list) {
          var bubble = document.createElement('div');
          bubble.className = 'update-bubble';

          var attPreview = '';
          if (attachments.length > 0) {
            attPreview = '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">' +
              attachments.map(function(att) {
                return '<span style="font-size:11px; color:#60a5fa; background:rgba(96,165,250,0.1); padding:2px 6px; border-radius:4px; border:1px solid #3b82f6;">📎 ' + escapeHtml(att.name) + ' (Uploaded)</span>';
              }).join('') +
            '</div>';
          }

          bubble.innerHTML = 
            '<div class="update-meta">' +
              '<span>' + escapeHtml(payload.author) + '</span>' +
              '<span>' + formatDateDisplay(payload.date) + '</span>' +
            '</div>' +
            '<div class="update-content">' + escapeHtml(payload.text) + '</div>' +
            attPreview;
          list.appendChild(bubble);
        }

        if (input) input.value = '';
        itemAttachmentsMap[rowIndex] = [];
        renderActionAttachments(rowIndex);

        if (btn) {
          btn.disabled = false;
          btn.innerText = "Post Note Update";
        }
      }).catch(function(err) {
        alert("Failed to post update: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Post Note Update";
        }
      });
    };

    window.closeLogItem = function(rowIndex) {
      if (!confirm("Are you sure you want to mark this item as Closed?")) return;

      var btn = document.getElementById('btn-close-' + rowIndex);
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Closing in Sheet...";
        btn.style.backgroundColor = "#475569";

      fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",

        body: JSON.stringify({
          action: "closeLogItem",
          rowIndex: rowIndex
        })

    function initRecceMap() {
      try {
        var container = document.getElementById('recce-map-container');
        if (!container || typeof L === 'undefined') return;

        if (!recceMap) {
          recceMap = L.map('recce-map-container').setView([32.5206, 34.9037], 13);

          streetTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
          });

          satelliteTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri World Imagery'
          });

          satelliteTileLayer.addTo(recceMap);

          recceMap.on('click', function(e) {
            handleMapClick(e.latlng.lat, e.latlng.lng);
          });
        }
        recceMap.invalidateSize();
      } catch (err) {
        console.warn("Leaflet map note:", err);
      }
    }

    function handleMapClick(lat, lng) {
      if (currentPinMode === 'venue') {
        setVenuePin(lat, lng);
      } else {
        setParkingPin(lat, lng);
      }
      updateDisplay();
    }

    function setVenuePin(lat, lng) {
      venueCoords = { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6) };

      if (typeof L !== 'undefined') {
        var redIcon = L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        if (venueMarker) {
          venueMarker.setLatLng([venueCoords.lat, venueCoords.lng]);
        } else if (recceMap) {
          venueMarker = L.marker([venueCoords.lat, venueCoords.lng], {
            icon: redIcon,
            title: "Venue"
          }).addTo(recceMap).bindPopup("📍 Venue").openPopup();
        }
      }

      document.getElementById('recce-venue-gmaps').value = 'https://www.google.com/maps?q=' + venueCoords.lat + ',' + venueCoords.lng;
      if (!parkingCoords) {
        document.getElementById('recce-waze').value = 'https://waze.com/ul?ll=' + venueCoords.lat + ',' + venueCoords.lng + '&navigate=yes';
      }
    }

    function setParkingPin(lat, lng) {
      parkingCoords = { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6) };

      if (typeof L !== 'undefined') {
        var blueIcon = L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        if (parkingMarker) {
          parkingMarker.setLatLng([parkingCoords.lat, parkingCoords.lng]);
        } else if (recceMap) {

            icon: blueIcon,
            title: "Parking"
          }).addTo(recceMap).bindPopup("🅿️ Parking").openPopup();

      document.getElementById('recce-waze').value = 'https://waze.com/ul?ll=' + parkingCoords.lat + ',' + parkingCoords.lng + '&navigate=yes';

    window.useCurrentLocation = function() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      var targetName = currentPinMode === 'venue' ? "Venue" : "Parking";
      var coordsDisplay = document.getElementById('coords-display');
      coordsDisplay.innerText = "Getting GPS location for " + targetName + "...";

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          if (recceMap) recceMap.setView([lat, lng], 16);
          if (currentPinMode === 'venue') {
            setVenuePin(lat, lng);
          } else {
            setParkingPin(lat, lng);
          }
          updateDisplay();
        },
        function(err) {
          coordsDisplay.innerHTML = "⚠️ GPS error (" + err.message + "). Tap map directly.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    };

    window.searchAddress = function() {
      var query = document.getElementById('map-search-input').value.trim();
      if (!query) {
        alert("Please enter a location name or address.");
        return;
      }

      var coordsDisplay = document.getElementById('coords-display');
      coordsDisplay.innerText = 'Searching for "' + query + '"...';

      var endpoint = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&accept-language=en&limit=1';
      fetch(endpoint, { headers: { 'Accept': 'application/json' } })
        .then(function(res) { return res.json(); })
        .then(function(results) {
          if (results && results.length > 0) {
            var lat = parseFloat(results[0].lat);
            var lng = parseFloat(results[0].lon);

            if (recceMap) recceMap.setView([lat, lng], 16);

            if (currentPinMode === 'venue') {
              setVenuePin(lat, lng);
              var locInput = document.getElementById("recce-location");
              if (!locInput.value) {
                locInput.value = results[0].display_name.split(',')[0];
              }
            } else {
              setParkingPin(lat, lng);
            }
            updateDisplay();
          } else {
            alert("Location not found. Try adding a city name or tap the map directly.");
          }
        })
        .catch(function() {
          alert("Search failed. Place pin manually on the map.");
        });
    };

    function handleIncomingFiles(fileList) {
      var files = Array.from(fileList);
      var countDisplay = document.getElementById('photo-count');
      var availableSlots = 10 - reccePhotos.length;

      if (availableSlots <= 0) {
        alert("Maximum of 10 photos reached.");
        return;
      }

      var batch = files.slice(0, availableSlots);
      if (countDisplay) countDisplay.innerText = "Optimizing " + batch.length + " photo(s)...";

      var compressQueue = batch.map(function(f) {
        return toBase64(f, 1280, 0.65).then(function(b64WithHeader) {
          return {
            base64: b64WithHeader.split(',')[1],
            mimeType: "image/jpeg",
            name: f.name || ('photo_' + Date.now() + '.jpg')
          };
        });
      });

      Promise.all(compressQueue).then(function(compressed) {
        compressed.forEach(function(item) { reccePhotos.push(item); });
        renderPhotoPreviews();
        if (countDisplay) countDisplay.innerText = reccePhotos.length + " photo(s) attached";
      }).catch(function(err) {
        console.error("Batch compression error:", err);
        alert("Failed to process some images.");
      });
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      var R = 6371; // Earth radius in km
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    window.findNearestHospital = function() {
      var btn = document.getElementById('btn-find-hospital');
      var card = document.getElementById('hospital-result-card');
      var nameEl = document.getElementById('hospital-name');
      var metaEl = document.getElementById('hospital-meta');
      var btnWaze = document.getElementById('btn-hospital-waze');
      var btnGmaps = document.getElementById('btn-hospital-gmaps');

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your device/browser.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ Acquiring GPS & Routing...";
      card.style.display = "block";
      nameEl.innerText = "Acquiring precise satellite GPS...";
      metaEl.innerText = "Calculating closest emergency trauma bay...";

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var userLat = pos.coords.latitude;
          var userLng = pos.coords.longitude;

          var closest = null;
          var minDistance = Infinity;

          REGIONAL_HOSPITALS.forEach(function(hosp) {
            var dist = calculateDistanceKm(userLat, userLng, hosp.lat, hosp.lng);
            if (dist < minDistance) {
              minDistance = dist;
              closest = hosp;
            }
          });

          if (closest) {
            var estDriveMinutes = Math.round((minDistance / 55) * 60) + 3;
            
            nameEl.innerText = closest.name;
            metaEl.innerText = "Straight-line: " + minDistance.toFixed(1) + " km | Est. drive: ~" + estDriveMinutes + " mins";

            btnWaze.href = "https://waze.com/ul?ll=" + closest.lat + "," + closest.lng + "&navigate=yes";
            btnGmaps.href = "https://www.google.com/maps/dir/?api=1&destination=" + closest.lat + "," + closest.lng + "&travelmode=driving";
          } else {
            nameEl.innerText = "No predefined hospital found";
            metaEl.innerText = "Please check network or manual search.";
          }

          btn.disabled = false;
          btn.innerText = "🔄 Update Nearest Hospital";
        },
        function(err) {
          btn.disabled = false;
          btn.innerText = "🚨 Emergency: Locate Nearest Hospital";
          nameEl.innerText = "GPS Error";
          metaEl.innerText = "Could not get current coordinates: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    };
