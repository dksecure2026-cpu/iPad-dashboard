<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #f4f4f7; padding: 20px; display: flex; justify-content: center; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); width: 100%; max-width: 600px; box-sizing: border-box; }
    .wide-card { max-width: 900px; }
    h1 { text-align: center; color: #222; margin-top: 0; }
    .dash-btn { width: 100%; padding: 18px; background-color: #333; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    .dash-btn:active { background-color: #000; }
    .back-btn { padding: 10px 14px; background-color: #e5e5ea; color: #111; border: none; border-radius: 8px; font-size: 15px; margin-bottom: 15px; font-weight: 600; cursor: pointer; }
    label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; color: #444; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit; }
    textarea { resize: vertical; min-height: 90px; }
    input[type="file"] { padding: 10px; background: #f8f9fa; border: 1px dashed #b0b0b0; }
    .submit-btn { width: 100%; padding: 16px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 16px; cursor: pointer; }
    #form-view, #calendar-view, #map-view, #recce-view { display: none; }
    #status-message, #recce-status-message { text-align: center; margin-top: 14px; font-weight: bold; }
    .error { color: #d93025; }
    .divider { text-align: center; margin: 12px 0; font-weight: bold; color: #888; font-size: 13px; }
    iframe { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    #recce-map-container { height: 280px; width: 100%; border-radius: 8px; border: 1px solid #ccc; margin-top: 6px; }
    .coord-display { font-size: 13px; color: #555; margin-top: 4px; }
    .confirm-box { background: #f8f9fa; border: 1px solid #dcdce0; border-radius: 8px; padding: 14px; margin-top: 20px; }
    .confirm-label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin: 0; font-size: 15px; color: #222; font-weight: 500; }
    .confirm-label input[type="checkbox"] { width: 22px; height: 22px; margin: 0; margin-top: 2px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- 1. MAIN DASHBOARD VIEW -->
  <div id="dashboard-view" class="card">
    <h1>Dashboard Menu</h1>
    <button class="dash-btn" onclick="openForm('Security Log')">Security Log</button>
    <button class="dash-btn" onclick="openForm('Requisition')">Requisition</button>
    <button class="dash-btn" onclick="openForm('Incident Report')">Incident Report</button>
    <button class="dash-btn" onclick="openForm('General Note')">General Note</button>
    
    <button class="dash-btn" style="background-color: #af52de;" onclick="openRecce()">New Recce Report</button>
    <button class="dash-btn" style="background-color: #007aff;" onclick="openCalendar()">Open Calendar</button>
    <button class="dash-btn" style="background-color: #34c759;" onclick="openMap()">Open Map</button>
  </div>

  <!-- 2. RECCE FORM VIEW -->
  <div id="recce
