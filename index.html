<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #f4f4f7; padding: 20px; display: flex; justify-content: center; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); width: 100%; max-width: 600px; box-sizing: border-box; }
    .wide-card { max-width: 900px; }
    h1 { text-align: center; color: #222; margin-top: 0; }
    .dash-btn { width: 100%; padding: 18px; background-color: #333; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-bottom: 12px; cursor: pointer; -webkit-appearance: none; }
    .dash-btn:active { background-color: #000; }
    .back-btn { padding: 10px 14px; background-color: #e5e5ea; color: #111; border: none; border-radius: 8px; font-size: 15px; margin-bottom: 15px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
    label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; color: #444; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit; }
    textarea { resize: vertical; min-height: 90px; }
    input[type="file"] { padding: 10px; background: #f8f9fa; border: 1px dashed #b0b0b0; }
    .submit-btn { width: 100%; padding: 16px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 16px; cursor: pointer; -webkit-appearance: none; }
    #form-view, #calendar-view, #map-view, #recce-view, #open-items-view { display: none; }
    #status-message, #recce-status-message { text-align: center; margin-top: 14px; font-weight: bold; }
    .error { color: #d93025; }
    .divider { text-align: center; margin: 12px 0; font-weight: bold; color: #888; font-size: 13px; }
    iframe { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    #recce-map-container { height: 340px; width: 100%; border-radius: 8px; border: 1px solid #ccc; margin-top: 6px; cursor: crosshair; }
    .coord-display { font-size: 13px; color: #444; margin-top: 6px; line-height: 1.5; background: #fafafa; padding: 8px 10px; border-radius: 6px; border: 1px solid #e5e5ea; }
    .confirm-box { background: #f8f9fa; border: 1px solid #dcdce0; border-radius: 8px; padding: 14px; margin-top: 20px; }
    .confirm-label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin: 0; font-size: 15px; color: #222; font-weight: 500; }
    .confirm-label input[type="checkbox"] { width: 22px; height: 22px; margin: 0; margin-top: 2px; flex-shrink: 0; }
    .task-card { background: #fdfdfd; border: 1px solid #e1e4e8; border-left: 5px solid #ff9500; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .task-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
    .close-item-btn { width: 100%; padding: 12px; background-color: #34c759; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. DASHBOARD MENU -->
  <div id="dashboard-view" class="card">
    <h1>Dashboard Menu</h1>
    <button type="button" class="dash-btn" onclick="openForm('Security Log')">Security Log</button>
    <button type="button" class="dash-btn" style="background-color: #ff9500;" onclick="openOpenItems()">⚠️ Open Action Items</button>
    <button type="button" class="dash-btn" style="background-color: #af52de;" onclick="openRecce()">New Recce Report</button>
    <button type="button" class="dash-btn" style="background-color: #007aff;" onclick="openCalendar()">Open Calendar</button>
    <button type="button" class="dash-btn" style="background-color: #34c759;" onclick="openMap()">Open Map</button>
  </div>

  <!-- 2. OPEN ACTION ITEMS VIEW -->
  <div id="open-items-view" class="card wide-card">
    <button type="button" class="back-btn" onclick="goBack()">← Back to Menu</button>
    <h1>Open Action Items</h1>
    <div id="open-items-status" style="text-align: center; color: #666; font-weight: bold; margin-bottom: 15px;">Loading active tasks...</div>
    <div id="open-items-list"></div>
  </div>

  <!-- 3. RECCE FORM VIEW -->
  <div id="recce-view" class="card wide-card">
    <button type="button" class="back-btn" onclick="goBack()">← Back to Menu</button>
    <h1>Recce Report</h1>
    <form id="recceForm">
      <label for="recce-location">Location Name</label>
      <input type="text" id="recce-location" placeholder="e.g. MARK SWIMMING COUNTRY CLUB" required>

      <label for="recce-officer">Officer Name</label>
      <input type="text" id="recce-officer" placeholder="Your name" required>

      <label for="recce-date">Date</label>
      <input type="date" id="recce-date" required>

      <label for="recce-desc">Description / Operational Notes</label>
      <textarea id="recce-desc" placeholder="Operational details, ingress routes, access codes..." required></textarea>

      <label>Location & Parking Setup</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button type="button" id="btn-mode-venue" class="back-btn" style="flex: 1; margin: 0; background-color: #df584c; color: white;" onclick="setPinMode('venue')">📍 Set Venue Pin</button>
        <button type="button" id="btn-mode-parking" class="back-btn" style="flex: 1; margin: 0; background-color: #e5e5ea; color: #111;" onclick="setPinMode('parking')">🅿️ Set Parking Pin</button>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="map-search-input" placeholder="Search address or venue name..." style="flex: 1; padding: 10px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc;">
        <button type="button" class="back-btn" style="margin: 0; padding: 10px 14px; white-space: nowrap;" onclick="searchAddress()">🔍 Find & Pin</button>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button type="button" id="btn-gps-action" class="back-btn" style="flex: 1; margin: 0; background-color: #007aff; color: white;" onclick="useCurrentLocation()">📍 Your GPS Location (Venue)</button>
        <button type="button" class="back-btn" style="margin: 0;" onclick="clearLocation()">✕ Reset Pins</button>
      </div>

      <div id="recce-map-container"></div>
      
      <div id="coords-display" class="coord-display">
        📍 Venue: Not set (Tap map or search)<br>
        🅿️ Parking: Not set (Switch mode, then tap map)
      </div>

      <label for="recce-venue-gmaps">Venue Google Maps URL</label>
      <input type="text" id="recce-venue-gmaps" placeholder="Generated from Venue Pin" required>

      <label for="recce-parking-gmaps">Parking Google Maps URL</label>
      <input type="text" id="recce-parking-gmaps" placeholder="Generated from Parking Pin">

      <label for="recce-waze">Parking Waze URL</label>
      <input type="text" id="recce-waze" placeholder="Generated from Parking Pin (or Venue fallback)">

      <label>Photos (Up to 10)</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button type="button" class="back-btn" style="flex: 1; margin: 0; background-color: #34c759; color: white;" onclick="triggerCamera()">
          📷 Take Photo
        </button>
        <button type="button" class="back-btn" style="flex: 1; margin: 0; background-color: #007aff; color: white;" onclick="triggerGallery()">
          🖼️ Photo Library
        </button>
      </div>

      <input type="file" id="recce-camera-input" accept="image/*" capture="environment" style="display: none;">
      <input type="file" id="recce-gallery-input" accept="image/*" multiple style="display: none;">

      <div id="photo-count" style="font-size: 13px; color: #555; margin-top: 4px; font-weight: 600;">0 photos attached</div>
      <div id="photo-preview-grid" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"></div>

      <div class="confirm-box">
        <label class="confirm-label">
          <input type="checkbox" id="recce-confirm-checkbox" style="accent-color: #af52de;" required>
          <span>I have reviewed the details, photos, and location pins, and confirm this report is complete.</span>
        </label>
      </div>

      <button type="submit" id="recceSubmitBtn" class="submit-btn" style="background-color: #af52de;">Submit & Generate PDF</button>
    </form>
    <div id="recce-status-message"></div>
  </div>

  <!-- 4. STANDARD LOG FORM VIEW -->
  <div id="form-view" class="card">
    <button type="button" class="back-btn" onclick="goBack()">← Back to Menu</button>
    <h1 id="form-title">Security Log</h1>
    <form id="logForm">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="date">Today's Date</label>
      <input type="date" id="date" required>

      <label for="type">Type of Entry</label>
      <select id="type" required>
        <option value="Security Log">Security Log</option>
      </select>

      <label for="remarks">Remarks / Issue Details</label>
      <textarea id="remarks" required></textarea>

      <label for="status">Status</label>
      <select id="status" required>
        <option value="Open">Open</option>
        <option value="Pending">Pending</option>
        <option value="Closed">Closed</option>
      </select>

      <label>Supporting Evidence (Choose ONE)</label>
      <input type="file" id="photo-upload" accept="image/*">
      <div class="divider">OR</div>
      <input type="text" id="evidence" placeholder="Paste a web link here...">

      <div class="confirm-box">
        <label class="confirm-label">
          <input type="checkbox" id="log-confirm-checkbox" style="accent-color: #007aff;" required>
          <span>I confirm this log entry is complete and ready to log.</span>
        </label>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Submit Entry</button>
    </form>
    <div id="status-message"></div>
  </div>

  <!-- 5. EMBEDDED CALENDAR VIEW -->
  <div id="calendar-view" class="card wide-card">
    <button type="button" class="back-btn" onclick="goBack()">← Back to Menu</button>
    <iframe src="https://calendar.google.com/calendar/embed?src=c_2a435d41777a365d165b71c9130adc35098df34b693919c1a47a0b63c3480a70@group.calendar.google.com&wkst=1&bgcolor=%23ffffff&ctz=Asia%2FJerusalem&mode=MONTH" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
  </div>

  <!-- 6. EMBEDDED MAP VIEW (GOOGLE MY MAPS) -->
  <div id="map-view" class="card wide-card">
    <button type="button" class="back-btn" onclick="goBack()">← Back to Menu</button>
    <iframe src="https://www.google.com/maps/d/u/0/embed?mid=15fLZ7_XkVsgFVSFTH87y_DJthMB5TU0&ehbc=2E312F" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
  </div>

  <script>
    var webAppUrl = "https://script.google.com/macros/s/AKfycby4-tNW7rooq0S7_gMQ2KVB9QwotwGjxiiO2CsJyuqH4tcVa30EQneFjPCjmLjn2r8xRQ/exec";

    var base64Image = "", fileName = "", mimeType = "";
    var reccePhotos = [];

    var recceMap = null;
    var currentPinMode = 'venue';
    var venueCoords = null;
    var parkingCoords = null;
    var venueMarker = null;
    var parkingMarker = null;

    window.hideAllViews = function() {
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('calendar-view').style.display = 'none';
      document.getElementById('map-view').style.display = 'none';
      document.getElementById('recce-view').style.display = 'none';
      document.getElementById('open-items-view').style.display = 'none';
    };

    window.openForm = function(entryType) {
      window.hideAllViews();
      document.getElementById('form-view').style.display = 'block';
      document.getElementById('type').value = entryType;
      document.getElementById('form-title').innerText = entryType;
    };

    window.openOpenItems = function() {
      window.hideAllViews();
      document.getElementById('open-items-view').style.display = 'block';
      loadOpenItems();
    };

    window.openCalendar = function() {
      window.hideAllViews();
      document.getElementById('calendar-view').style.display = 'block';
    };

    window.openMap = function() {
      window.hideAllViews();
      document.getElementById('map-view').style.display = 'block';
    };

    window.openRecce = function() {
      window.hideAllViews();
      document.getElementById('recce-view').style.display = 'block';
      setTimeout(function() {
        initRecceMap();
      }, 200);
    };

    window.goBack = function() {
      window.hideAllViews();
      document.getElementById('dashboard-view').style.display = 'block';
      var s1 = document.getElementById('status-message');
      if (s1) s1.innerText = "";
      var s2 = document.getElementById('recce-status-message');
      if (s2) s2.innerText = "";
    };

    // Load Open Items via JSONP (bypasses browser CORS blocks)
    function loadOpenItems() {
      var statusDiv = document.getElementById('open-items-status');
      var listDiv = document.getElementById('open-items-list');
      statusDiv.innerText = "Checking Google Sheet for open entries...";
      listDiv.innerHTML = "";

      var scriptId = 'jsonp-open-items';
      var oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleOpenItemsCallback = function(response) {
        if (!response || !response.items || response.items.length === 0) {
          statusDiv.innerText = "✅ No open or pending action items. All tasks are closed!";
          return;
        }

        statusDiv.innerText = "Found " + response.items.length + " active issue(s):";
        listDiv.innerHTML = "";

        response.items.forEach(function(item) {
          var card = document.createElement('div');
          card.className = 'task-card';

          var badgeColor = item.status.toLowerCase() === 'open' ? '#d93025' : '#f57f17';
          var badgeBg = item.status.toLowerCase() === 'open' ? '#ffebee' : '#fff8e1';

          var evidenceHtml = item.evidence 
            ? '<div style="margin-top: 6px;"><a href="' + item.evidence + '" target="_blank" style="color: #007aff; font-weight: bold; font-size: 13px;">🔗 View Uploaded Evidence</a></div>'
            : '';

          card.innerHTML = 
            '<div>' +
              '<span class="task-badge" style="background: ' + badgeBg + '; color: ' + badgeColor + ';">' + item.status + '</span>' +
              '<span style="font-size: 12px; color: #777; margin-left: 8px;">' + (item.date || '') + ' | Logged by: ' + (item.name || 'Officer') + '</span>' +
            '</div>' +
            '<div style="font-size: 15px; font-weight: bold; margin: 8px 0 4px 0; color: #222;">' + (item.type || 'Log Entry') + '</div>' +
            '<div style="font-size: 14px; line-height: 1.5; color: #444; white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee;">' + (item.remarks || 'No remarks provided') + '</div>' +
            evidenceHtml +
            '<button type="button" class="close-item-btn" id="btn-close-' + item.rowIndex + '" onclick="closeLogItem(' + item.rowIndex + ')">✓ Mark as Closed (Turns Green in Sheet)</button>';

          listDiv.appendChild(card);
        });
      };

      var script = document.createElement('script');
      script.id = scriptId;
      script.src = webAppUrl + '?action=getOpenLogs&callback=handleOpenItemsCallback&t=' + Date.now();
      document.body.appendChild(script);
    }

    // Close item handler
    window.closeLogItem = function(rowIndex) {
      if (!confirm("Are you sure you want to mark this item as Closed?")) return;

      var btn = document.getElementById('btn-close-' + rowIndex);
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Closing in Sheet...";
        btn.style.backgroundColor = "#aaa";
      }

      fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "closeLogItem",
          rowIndex: rowIndex
        })
      }).then(function() {
        alert("Item closed successfully! It is now marked green in Google Sheets.");
        loadOpenItems(); // Refresh the active list
      }).catch(function(err) {
        alert("Error closing item: " + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerText = "✓ Mark as Closed";
          btn.style.backgroundColor = "#34c759";
        }
      });
    };

    window.triggerCamera = function() {
      var el = document.getElementById('recce-camera-input');
      if (el) el.click();
    };

    window.triggerGallery = function() {
      var el = document.getElementById('recce-gallery-input');
      if (el) el.click();
    };

    window.setPinMode = function(mode) {
      currentPinMode = mode;
      var btnVenue = document.getElementById('btn-mode-venue');
      var btnParking = document.getElementById('btn-mode-parking');
      var btnGps = document.getElementById('btn-gps-action');

      if (mode === 'venue') {
        btnVenue.style.backgroundColor = '#df584c';
        btnVenue.style.color = '#fff';
        btnParking.style.backgroundColor = '#e5e5ea';
        btnParking.style.color = '#111';
        btnGps.innerText = "📍 Your GPS Location (Venue)";
      } else {
        btnParking.style.backgroundColor = '#007aff';
        btnParking.style.color = '#fff';
        btnVenue.style.backgroundColor = '#e5e5ea';
        btnVenue.style.color = '#111';
        btnGps.innerText = "📍 Your GPS Location (Parking)";
      }
    };

    function initRecceMap() {
      try {
        var container = document.getElementById('recce-map-container');
        if (!container || typeof L === 'undefined') return;

        if (!recceMap) {
          recceMap = L.map('recce-map-container').setView([32.5206, 34.9037], 13);
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
          }).addTo(recceMap);

          recceMap.on('click', function(e) {
            handleMapClick(e.latlng.lat, e.latlng.lng);
          });
        }
        recceMap.invalidateSize();
      } catch (err) {
        console.warn("Leaflet init error:", err);
      }
    }

    function handleMapClick(lat, lng) {
      if (currentPinMode === 'venue') {
        setVenuePin(lat, lng);
      } else {
        setParkingPin(lat, lng);
      }
      updateDisplay();
    }

    function setVenuePin(lat, lng) {
      venueCoords = { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6) };

      if (typeof L !== 'undefined') {
        var redIcon = L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        if (venueMarker) {
          venueMarker.setLatLng([venueCoords.lat, venueCoords.lng]);
        } else if (recceMap) {
          venueMarker = L.marker([venueCoords.lat, venueCoords.lng], {
            icon: redIcon,
            title: "Venue"
          }).addTo(recceMap).bindPopup("📍 Venue").openPopup();
        }
      }

      document.getElementById('recce-venue-gmaps').value = 'https://www.google.com/maps?q=' + venueCoords.lat + ',' + venueCoords.lng;

      if (!parkingCoords) {
        document.getElementById('recce-waze').value = 'https://waze.com/ul?ll=' + venueCoords.lat + ',' + venueCoords.lng + '&navigate=yes';
      }
    }

    function setParkingPin(lat, lng) {
      parkingCoords = { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6) };

      if (typeof L !== 'undefined') {
        var blueIcon = L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
        });

        if (parkingMarker) {
          parkingMarker.setLatLng([parkingCoords.lat, parkingCoords.lng]);
        } else if (recceMap) {
          parkingMarker = L.marker([parkingCoords.lat, parkingCoords.lng], {
            icon: blueIcon,
            title: "Parking"
          }).addTo(recceMap).bindPopup("🅿️ Parking").openPopup();
        }
      }

      document.getElementById('recce-parking-gmaps').value = 'https://www.google.com/maps?q=' + parkingCoords.lat + ',' + parkingCoords.lng;
      document.getElementById('recce-waze').value = 'https://waze.com/ul?ll=' + parkingCoords.lat + ',' + parkingCoords.lng + '&navigate=yes';
    }

    function updateDisplay() {
      var display = document.getElementById('coords-display');
      display.innerHTML = '📍 Venue: ' + (venueCoords ? (venueCoords.lat + ', ' + venueCoords.lng) : 'Not set (Tap map or search)') + '<br>' +
                          '🅿️ Parking: ' + (parkingCoords ? (parkingCoords.lat + ', ' + parkingCoords.lng) : 'Not set (Switch to Parking, then tap map)');
    }

    window.clearLocation = function() {
      venueCoords = null;
      parkingCoords = null;

      if (venueMarker && recceMap) { recceMap.removeLayer(venueMarker); venueMarker = null; }
      if (parkingMarker && recceMap) { recceMap.removeLayer(parkingMarker); parkingMarker = null; }

      document.getElementById('coords-display').innerHTML = '📍 Venue: Not set (Tap map or search)<br>🅿️ Parking: Not set (Switch mode, then tap map)';
      document.getElementById('recce-venue-gmaps').value = "";
      document.getElementById('recce-parking-gmaps').value = "";
      document.getElementById('recce-waze').value = "";

      var searchBox = document.getElementById('map-search-input');
      if (searchBox) searchBox.value = "";
      window.setPinMode('venue');
    };

    window.useCurrentLocation = function() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      var targetName = currentPinMode === 'venue' ? "Venue" : "Parking";
      var coordsDisplay = document.getElementById('coords-display');
      coordsDisplay.innerText = "Fetching current GPS location for " + targetName + "...";

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          if (recceMap) recceMap.setView([lat, lng], 16);

          if (currentPinMode === 'venue') {
            setVenuePin(lat, lng);
          } else {
            setParkingPin(lat, lng);
          }
          updateDisplay();
        },
        function(err) {
          coordsDisplay.innerHTML = "⚠️ Unable to retrieve GPS (" + err.message + "). Tap the map directly.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    };

    window.searchAddress = function() {
      var query = document.getElementById('map-search-input').value.trim();
      if (!query) {
        alert("Please enter an address or place name to search.");
        return;
      }

      var coordsDisplay = document.getElementById('coords-display');
      coordsDisplay.innerText = 'Searching for "' + query + '"...';

      var endpoint = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&accept-language=en&limit=1';
      fetch(endpoint, { headers: { 'Accept': 'application/json' } })
        .then(function(res) { return res.json(); })
        .then(function(results) {
          if (results && results.length > 0) {
            var lat = parseFloat(results[0].lat);
            var lng = parseFloat(results[0].lon);

            if (recceMap) recceMap.setView([lat, lng], 16);

            if (currentPinMode === 'venue') {
              setVenuePin(lat, lng);
              var locInput = document.getElementById("recce-location");
              if (!locInput.value) {
                locInput.value = results[0].display_name.split(',')[0];
              }
            } else {
              setParkingPin(lat, lng);
            }
            updateDisplay();
          } else {
            alert("Location not found. Try adding a city name or tap the map directly.");
          }
        })
        .catch(function() {
          alert("Search failed. Place pin manually on the map.");
        });
    };

    function toBase64(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
          var img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            var maxDim = 1200;
            var width = img.width;
            var height = img.height;

            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.onerror = function(err) { reject(err); };
        };
        reader.onerror = function(err) { reject(err); };
      });
    }

    function renderPhotoPreviews() {
      var previewGrid = document.getElementById('photo-preview-grid');
      var countDisplay = document.getElementById('photo-count');
      if (!previewGrid) return;
      previewGrid.innerHTML = "";

      reccePhotos.forEach(function(photo, index) {
        var thumbWrapper = document.createElement('div');
        thumbWrapper.style.position = 'relative';
        thumbWrapper.style.width = '70px';
        thumbWrapper.style.height = '70px';

        var img = document.createElement('img');
        img.src = 'data:' + photo.mimeType + ';base64,' + photo.base64;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '6px';
        img.style.border = '1px solid #ccc';

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.innerText = '×';
        removeBtn.style.position = 'absolute';
        removeBtn.style.top = '-5px';
        removeBtn.style.right = '-5px';
        removeBtn.style.backgroundColor = '#d93025';
        removeBtn.style.color = 'white';
        removeBtn.style.border = 'none';
        removeBtn.style.borderRadius = '50%';
        removeBtn.style.width = '20px';
        removeBtn.style.height = '20px';
        removeBtn.style.fontSize = '14px';
        removeBtn.style.fontWeight = 'bold';
        removeBtn.style.lineHeight = '18px';
        removeBtn.style.padding = '0';
        removeBtn.style.cursor = 'pointer';

        removeBtn.onclick = function() {
          reccePhotos.splice(index, 1);
          renderPhotoPreviews();
          if (countDisplay) countDisplay.innerText = reccePhotos.length + " photo(s) attached";
        };

        thumbWrapper.appendChild(img);
        thumbWrapper.appendChild(removeBtn);
        previewGrid.appendChild(thumbWrapper);
      });
    }

    function handleIncomingFiles(fileList) {
      var files = Array.from(fileList);
      var countDisplay = document.getElementById('photo-count');

      files.forEach(function(f) {
        if (reccePhotos.length >= 10) {
          alert("Maximum of 10 photos reached.");
          return;
        }

        if (countDisplay) countDisplay.innerText = "Processing photo... (" + (reccePhotos.length + 1) + "/10)";

        toBase64(f).then(function(b64WithHeader) {
          var rawB64 = b64WithHeader.split(',')[1];
          reccePhotos.push({
            base64: rawB64,
            mimeType: "image/jpeg",
            name: f.name || ('photo_' + Date.now() + '.jpg')
          });
          renderPhotoPreviews();
          if (countDisplay) countDisplay.innerText = reccePhotos.length + " photo(s) attached";
        }).catch(function(err) {
          console.error("Compression failed:", err);
        });
      });
    }

    window.onload = function() {
      var d1 = document.getElementById('date');
      if (d1) d1.valueAsDate = new Date();
      var d2 = document.getElementById('recce-date');
      if (d2) d2.valueAsDate = new Date();

      var singlePhoto = document.getElementById('photo-upload');
      if (singlePhoto) {
        singlePhoto.onchange = function(e) {
          var file = e.target.files[0];
          if (file) {
            fileName = file.name;
            mimeType = file.type;
            var reader = new FileReader();
            reader.onload = function(ev) { base64Image = ev.target.result.split(',')[1]; };
            reader.readAsDataURL(file);
          }
        };
      }

      var cameraInput = document.getElementById('recce-camera-input');
      if (cameraInput) {
        cameraInput.onchange = function(e) {
          if (e.target.files.length > 0) {
            handleIncomingFiles(e.target.files);
            cameraInput.value = "";
          }
        };
      }

      var galleryInput = document.getElementById('recce-gallery-input');
      if (galleryInput) {
        galleryInput.onchange = function(e) {
          if (e.target.files.length > 0) {
            handleIncomingFiles(e.target.files);
            galleryInput.value = "";
          }
        };
      }

      var searchField = document.getElementById('map-search-input');
      if (searchField) {
        searchField.onkeydown = function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            window.searchAddress();
          }
        };
      }

      var recceForm = document.getElementById("recceForm");
      if (recceForm) {
        recceForm.onsubmit = function(e) {
          e.preventDefault();
          var locationName = document.getElementById("recce-location").value.trim();
          var officer = document.getElementById("recce-officer").value.trim();
          var desc = document.getElementById("recce-desc").value.trim();
          var venueGmapsVal = document.getElementById("recce-venue-gmaps").value.trim();
          var confirmBox = document.getElementById("recce-confirm-checkbox");

          if (!confirmBox.checked) {
            alert("Please tick the confirmation checkbox at the bottom before submitting.");
            return;
          }

          if (!venueCoords && !venueGmapsVal) {
            alert("Please set a venue location on the map before submitting.");
            return;
          }

          var confirmed = confirm(
            "Are you ready to submit this Recce Report?\n\n" +
            "• Venue: " + locationName + "\n" +
            "• Officer: " + officer + "\n" +
            "• Parking Pin: " + (parkingCoords ? "Set" : "Not set (Waze will point to venue)") + "\n" +
            "• Photos: " + reccePhotos.length + "\n\n" +
            "Tap OK to generate PDF & submit, or Cancel to keep editing."
          );

          if (!confirmed) return;

          var btn = document.getElementById("recceSubmitBtn");
          btn.disabled = true;
          btn.innerText = "Generating PDF & Uploading...";
          btn.style.backgroundColor = "#ccc";

          var payload = {
            formType: "Recce",
            locationName: locationName,
            officer: officer,
            date: document.getElementById("recce-date").value,
            description: desc,
            googleMapsUrl: venueGmapsVal,
            parkingGoogleMapsUrl: document.getElementById("recce-parking-gmaps").value.trim(),
            wazeUrl: document.getElementById("recce-waze").value.trim(),
            lat: venueCoords ? venueCoords.lat : "0",
            lng: venueCoords ? venueCoords.lng : "0",
            parkingLat: parkingCoords ? parkingCoords.lat : "",
            parkingLng: parkingCoords ? parkingCoords.lng : "",
            photos: reccePhotos
          };

          fetch(webAppUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          }).then(function() {
            alert("Submission sent successfully! Check Google Sheets.");
            btn.disabled = false;
            btn.innerText = "Submit & Generate PDF";
            btn.style.backgroundColor = "#af52de";
            document.getElementById("recceForm").reset();
            window.clearLocation();
            reccePhotos = [];
            var previewGrid = document.getElementById("photo-preview-grid");
            if (previewGrid) previewGrid.innerHTML = "";
            var countDisplay = document.getElementById("photo-count");
            if (countDisplay) countDisplay.innerText = "0 photos attached";
            var dRecce = document.getElementById('recce-date');
            if (dRecce) dRecce.valueAsDate = new Date();
            window.goBack();
          }).catch(function(err) {
            alert("Submission network error: " + err.message);
            btn.disabled = false;
            btn.innerText = "Submit & Generate PDF";
            btn.style.backgroundColor = "#af52de";
            document.getElementById('recce-status-message').innerText = "Upload error: " + err;
            document.getElementById('recce-status-message').className = "error";
          });
        };
      }

      var logForm = document.getElementById("logForm");
      if (logForm) {
        logForm.onsubmit = function(event) {
          event.preventDefault();
          var logConfirm = document.getElementById("log-confirm-checkbox");
          if (!logConfirm.checked) {
            alert("Please tick the confirmation checkbox before submitting.");
            return;
          }

          var confirmed = confirm("Are you sure you want to submit this log entry?");
          if (!confirmed) return;

          var btn = document.getElementById("submitBtn");
          btn.disabled = true;
          btn.innerText = "Uploading...";
          btn.style.backgroundColor = "#ccc";

          var payload = {
            formType: "Log",
            column2: document.getElementById("name").value,
            column3: document.getElementById("date").value,
            column4: document.getElementById("type").value,
            column5: document.getElementById("remarks").value,
            column6: document.getElementById("status").value,
            column7: document.getElementById("evidence").value,
            imageBase64: base64Image,
            fileName: fileName,
            mimeType: mimeType
          };

          fetch(webAppUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          }).then(function() {
            alert("Log entry sent successfully!");
            btn.disabled = false;
            btn.innerText = "Submit Entry";
            btn.style.backgroundColor = "#007aff";
            document.getElementById("logForm").reset();
            var dLog = document.getElementById('date');
            if (dLog) dLog.valueAsDate = new Date();
            base64Image = ""; fileName = ""; mimeType = "";
            window.goBack();
          }).catch(function(err) {
            alert("Log error: " + err.message);
            btn.disabled = false;
            btn.innerText = "Submit Entry";
            btn.style.backgroundColor = "#007aff";
            document.getElementById('status-message').innerText = "Error sending data.";
            document.getElementById('status-message').className = "error";
          });
        };
      }
    };
  </script>
</body>
</html>
